[project]
name = "marc-ai"
version = "0.1.0"
description = "RAG system for Spanish technical regulations using unstructured document processing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "openai==1.35.13",
    "unstructured[pdf]==0.15.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pillow>=9.0.0",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]
